name: Collector heartbeat
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: collector-heartbeat
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check collection and published heartbeat
        env:
          JPI_ALERT_WEBHOOK_URL: ${{ secrets.JPI_ALERT_WEBHOOK_URL }}
          JPI_PUBLIC_HEALTH_URL: ${{ vars.JPI_PUBLIC_HEALTH_URL }}
        run: python3 scripts/check_heartbeat.py
